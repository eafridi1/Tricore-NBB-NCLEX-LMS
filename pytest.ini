[pytest]
asyncio_mode = auto
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Suppress SQLAlchemy echo during tests (it's noisy; enable per-test
# by setting echo=True on the engine when debugging a specific query)
filterwarnings =
    ignore::DeprecationWarning:sqlalchemy
    ignore::DeprecationWarning:aiosqlite